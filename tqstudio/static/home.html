<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tqstudio · Home</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside>
    <div class="brand">tq<span>studio</span><sup class="beta">beta</sup></div>
    <nav><a class="active" href="/">Home</a><a href="/market">Market data</a><a href="/calibration">Calibration</a><a href="/tradepad">Tradepad</a></nav>
    <div class="side-foot" id="snapshot"></div>
  </aside>

  <div class="page">
    <div class="topbar"><h1>Home</h1></div>

    <main>
      <div class="panel">
        <h2>Documents</h2>
        <div class="tiles" id="documents"></div>
      </div>
    </main>
  </div>

  <script>
    fetch("/api/documents").then((r) => r.json()).then(({ snapshot, source, documents }) => {
      document.getElementById("snapshot").textContent = `${source} · ${snapshot}`;
      document.getElementById("documents").innerHTML = documents.map((d) => d.available
        ? `<a class="tile" href="/documents/${d.key}" target="_blank" rel="noopener">
             <div class="tile-title">${d.title} <span class="pill">PDF</span></div></a>`
        : `<div class="tile disabled"><div class="tile-title">${d.title}</div>
             <div class="tile-text">Not built on this machine: run <code>latexmk</code> in <code>study/docs</code>.</div></div>`
      ).join("");
    });
  </script>
</body>
</html>
