<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tqstudio · Tradepad</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
  <aside>
    <div class="brand">tq<span>studio</span></div>
    <nav><a href="/">Home</a><a href="/market">Market data</a><a class="active" href="/tradepad">Tradepad</a></nav>
    <div class="side-foot" id="snapshot"></div>
  </aside>

  <div class="page">
    <div class="topbar"><h1>Tradepad</h1></div>

    <main class="tradepad">
      <div class="panel">
        <div class="segmented" id="asset-classes"></div>
        <div class="form">
          <div class="field wide"><label for="product">Product type</label><select id="product"></select></div>
        </div>
        <div class="section-label">Deal</div>
        <div class="form" id="fields"></div>
        <div class="section-label">Model</div>
        <div class="form">
          <div class="field wide"><label for="model">Model</label><select id="model"></select></div>
          <div class="field wide mc"><label for="n_paths">MC paths</label>
            <select id="n_paths"><option value="20000">20,000</option><option value="50000" selected>50,000</option>
              <option value="100000">100,000</option></select></div>
        </div>
        <button id="price">Price</button>
        <span id="status" class="muted"></span>
        <p class="note">Market data: latest snapshot. Greeks by AAD to the market risk factors (rho per curve pillar,
          vega per vol node).</p>
      </div>

      <div>
        <div id="empty" class="panel empty">Pick a product, fill the deal and press <b>Price</b>.</div>
        <div id="results-section" class="hidden">
          <div class="panel">
            <h2>Valuation <span id="model-info" class="pill"></span></h2>
            <div id="valuation" class="cards"></div>
          </div>
          <div class="panel">
            <h2>Details</h2>
            <div id="info" class="cards"></div>
          </div>
          <div class="panel" id="vega-panel">
            <h2 id="vega-title">Vega</h2>
            <div id="chart-vega" class="chart" style="height: 400px"></div>
          </div>
          <div class="panel" id="rho-panel">
            <h2>Rho per curve pillar <span class="muted">(1 bp)</span></h2>
            <div id="chart-rho" class="chart"></div>
            <div id="rho-table" class="hscroll" style="margin-top: 10px"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/static/tradepad.js"></script>
</body>
</html>
