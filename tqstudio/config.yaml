# tqstudio: the configuration of the app (the same file on every machine; each machine takes what applies to it).

# The market data folder (snapshots, price history, caches, config/universe.yaml), the first that exists in this order;
# `python -m tqstudio --marketdata <folder>` overrides it. The app of every user reads it; the downloads of an
# authorized pc write it. Config settings and calibration live in the repository now (marketdata/config/).
marketdata_roots:
  - W:\Everyone\Quants\tqdata              # shared data (CL100400340051 writes it, the shared app reads it from Linux)
  - C:\dev\tQuant\marketdata               # LAPTOP-OIB56OK9: local copy, when the share is not reachable
  - /mnt-quants/strategy/tqdata            # shared Linux machine (the app of the users)

# Who may edit the universe and start downloads: pcs with a Bloomberg terminal. No pc is allowed by default. A download
# starts only from a tqstudio running on one of them (the download runs there, on its terminal), requested from one of
# them: the shared app, on a pc not listed, never downloads.
authorized_pcs:
  - CL100400340051                         # this pc (shared data on W:)
  - LAPTOP-OIB56OK9                        # my personal laptop

# Interpreters for the download and the processes the app starts, the first that exists and imports blpapi
# (`current`: the Python running tqstudio).
python:
  - C:\dev\virtual_envs\tqenv\Scripts\python.exe                                    # LAPTOP-OIB56OK9
  - C:\Users\S542279\AppData\Local\Programs\tqenv\Scripts\python.exe                # CL100400340051
  - current
