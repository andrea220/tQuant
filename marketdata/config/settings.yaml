# Bloomberg Desktop API (the terminal on this machine)
bloomberg:
  host: localhost
  port: 8194
  timeout_ms: 30000

# Bloomberg fields (check them with FLDS on the terminal)
fields:
  price: PX_LAST            # spot (equity, FX) and fixing value (rates, in %)
  currency: CRNCY
  name: NAME
  last_update: LAST_UPDATE_DT
  dividends: BDVD_ALL_PROJECTIONS   # Bloomberg dividend projections: ex-date, amount per share (no pay date)
  declared_dividends: DVD_HIST_ALL  # declared dividends (future ex-dates, pay dates): replace the projections
  curve_rates: CURVE_TENOR_RATES    # ICVS curve members: tenor, ticker, bid / mid / ask yield (%), last update

history:
  years: 10                 # daily closes of the whole universe, kept in history/prices.parquet
  adjust_splits: true       # prices adjusted for splits only (price returns), whatever the terminal's DPDF settings
  adjust_dividends: false

# Listed equity options for the vol surfaces (few data: cached chains, selected strikes, four fields)
options:
  chain_max_age_days: 7     # OPT_CHAIN kept in cache/option_chains/ (strikes listed change little)
  front_expiries: 3         # the first expiries, then the quarterly ones (Mar / Jun / Sep / Dec)
  max_years: 6.2
  moneyness: [0.5, 0.6, 0.7, 0.8, 0.85, 0.9, 0.95, 0.975, 1.0, 1.025, 1.05, 1.1, 1.15, 1.2, 1.3, 1.4, 1.5]  # of F
  parity_strikes: 2         # calls and puts at the 2 strikes on each side of the forward (put-call parity)
  stale_days: 3             # quotes older than this before the quote date are dropped
  rates:                    # overnight fixing per currency: forward estimate to choose the strikes
    EUR: ESTRON Index
    USD: SOFRRATE Index
    GBP: SONIO/N Index

correlation:
  window_days: 252          # log returns of the last window (dates common to all the factors)

output:
  snapshots: live           # marketdata/live/<yyyymmdd>/<hhmm>/ (git-ignored: licensed data)
  history: history          # marketdata/history/ (git-ignored)
  cache: cache              # marketdata/cache/ (git-ignored): option chains
